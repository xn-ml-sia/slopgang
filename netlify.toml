# File-based config for https://slopgang.org — overrides Netlify UI build settings.
# After merge, trigger a production redeploy if Git auto-deploys are paused.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# JSON for the iOS app and other readers. Short cache so new plates show fast.
[[headers]]
  for = "/archive.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/about.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

# Same /api/* paths the Vite middleware uses in `npm run dev` / `npm run preview`.
# force=true so the SPA fallback below cannot swallow these routes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# History API / SPA fallback. Not forced, so hashed /assets/* files in dist still win.
# sg-22 used to be an SVG wrapper around a corrupt base64 webp; old links go to the real webp
[[redirects]]
  from = "/archive/sg-22.svg"
  to = "/archive/sg-22.webp"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
